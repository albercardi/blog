name: Actualizar libros y peliculas y publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar portadas locales
        uses: actions/cache@v4
        with:
          path: libros/portadas
          key: portadas-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            portadas-v1-${{ github.ref_name }}-

      - name: Verificar archivos necesarios
        run: |
          test -f index.html
          test -f libros/index.html
          test -s updates/goodreads_library_export.csv
          test -f tools/actualizar_libros.py
          test -f peliculas/index.html
          test -s updates/peliculas.csv
          test -f tools/actualizar_peliculas.py

      - name: Actualizar libros
        run: |
          python tools/actualizar_libros.py
          test -s libros/libros.js
          node --check libros/libros.js

      - name: Actualizar peliculas
        run: |
          rm -f peliculas/peliculas.js
          python tools/actualizar_peliculas.py --output peliculas/peliculas.js
          test -s peliculas/peliculas.js
          node --check peliculas/peliculas.js

      - name: Verificar libros generados
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          js = Path("libros/libros.js").read_text(encoding="utf-8")
          match = re.search(r"\bconst\s+BOOKS\s*=\s*", js)
          if not match:
              raise SystemExit("No se encontró la lista BOOKS.")
          books, _ = json.JSONDecoder().raw_decode(js[match.end():].lstrip())
          if not books:
              raise SystemExit("La lista de libros está vacía.")
          print(f"Libros preparados: {len(books)}")
          print(f"Con portada: {sum(bool(b.get('cover')) for b in books)}")
          for book in books:
              cover = book.get("cover", "")
              if cover and (not cover.startswith("portadas/") or not (Path("libros") / cover).is_file()):
                  raise SystemExit(f"Portada local ausente o inválida: {cover}")
          PY

      - name: Verificar datos y enlace de peliculas
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          html = Path("peliculas/index.html").read_text(encoding="utf-8")
          sources = re.findall(r'<script\b[^>]*\bsrc\s*=\s*[\'"]([^\'"]+)[\'"]', html, flags=re.I)
          if not any(s.split("?", 1)[0] in ("peliculas.js", "./peliculas.js", "/blog/peliculas/peliculas.js", "/peliculas/peliculas.js") for s in sources):
              raise SystemExit("El HTML no carga peliculas.js. Revisar la etiqueta script.")
          js = Path("peliculas/peliculas.js").read_text(encoding="utf-8")
          movies = json.JSONDecoder().raw_decode(js.split("const MOVIES =", 1)[1].lstrip())[0]
          print(f"Titulos preparados para publicar: {len(movies)}")
          for movie in movies[:5]:
              print(movie["created"], movie["title"])
          PY

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del sitio
        run: |
          mkdir -p "$RUNNER_TEMP/sitio"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='tools/' --exclude='updates/' ./ "$RUNNER_TEMP/sitio/"
          cmp libros/libros.js "$RUNNER_TEMP/sitio/libros/libros.js"
          cmp peliculas/peliculas.js "$RUNNER_TEMP/sitio/peliculas/peliculas.js"

      - name: Subir sitio preparado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/sitio

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
