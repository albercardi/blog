<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title> Albertina C · Películas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@300..700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #777777;
      --border: #e0e0e0;
      --accent: #B33820;
      --surface: #f7f6f3;
      --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
      --card-shadow-hover: 0 8px 24px rgba(0,0,0,0.14);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 2.5rem 1.4rem 4rem;
      font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      display: flex;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: 960px;
    }

    /* ── Header ── */
    .site-header {
      margin-bottom: 2.4rem;
      text-align: center;
    }
    .site-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 2.2rem;
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 0.6rem;
    }
    .site-tagline {
      font-size: 0.92rem;
      color: var(--muted);
      font-style: italic;
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.5;
    }
    .site-tagline cite {
      font-style: normal;
      font-size: 0.82rem;
      display: block;
      margin-top: 0.25rem;
      color: var(--muted);
      opacity: 0.75;
    }

    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--accent); }

    .back-link {
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .back-link:hover { color: var(--accent); text-decoration: underline; }

    /* ── Stats ── */
    .stats-bar {
      display: flex;
      gap: 1.8rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 1.6rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid var(--border);
    }
    .stat { display: flex; flex-direction: column; gap: 0.1rem; }
    .stat-value {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 1.7rem;
      line-height: 1;
      color: var(--accent);
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── Filters ── */
    .filter-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.8rem;
      align-items: flex-start;
    }
    .filter-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-label { font-size: 0.82rem; color: var(--muted); margin-right: 0.2rem; }
    .filter-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.28rem 0.85rem;
      font-size: 0.82rem;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      transition: all 160ms ease;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── Search ── */
    .search-wrap {
      margin-bottom: 1.4rem;
    }
    .search-input {
      width: 100%;
      max-width: 340px;
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.85rem;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      outline: none;
      transition: border-color 160ms;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: #bbb; }

    /* ── Grid ── */
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 1.4rem 1.2rem;
    }

    /* ── Card ── */
    .movie-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .movie-card:focus-visible .movie-poster-wrap {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .movie-poster-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2/3;
      background: var(--surface);
      border-radius: 3px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      transition: box-shadow 200ms ease, transform 200ms ease;
    }
    .movie-card:hover .movie-poster-wrap {
      box-shadow: var(--card-shadow-hover);
      transform: translateY(-3px);
    }
    .movie-poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .movie-poster-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem;
      background: linear-gradient(145deg, #f0eee9 0%, #e8e5df 100%);
    }
    .movie-poster-placeholder span {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 0.73rem;
      text-align: center;
      color: #888;
      line-height: 1.35;
    }

    /* IMDb rating badge */
    .imdb-badge {
      position: absolute;
      bottom: 0.35rem;
      right: 0.35rem;
      background: rgba(0,0,0,0.65);
      color: #f5c518;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
      line-height: 1.4;
      letter-spacing: 0.01em;
    }

    .movie-title {
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
      margin-top: 0.5rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .movie-director {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.12rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .movie-meta {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--bg);
      border-radius: 6px;
      max-width: 540px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.8rem;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.22);
    }
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--muted);
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      line-height: 1;
      transition: color 150ms;
    }
    .modal-close:hover { color: var(--text); }

    .modal-inner { display: flex; gap: 1.4rem; align-items: flex-start; }

    .modal-poster-wrap {
      flex-shrink: 0;
      width: 110px;
      aspect-ratio: 2/3;
      border-radius: 3px;
      overflow: hidden;
      background: var(--surface);
      box-shadow: 0 4px 16px rgba(0,0,0,0.16);
    }
    .modal-poster-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .modal-poster-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem;
      background: linear-gradient(145deg, #f0eee9 0%, #e8e5df 100%);
    }
    .modal-poster-placeholder span {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 0.78rem;
      text-align: center;
      color: #888;
    }

    .modal-info { flex: 1; min-width: 0; }
    .modal-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 1.22rem;
      line-height: 1.25;
      margin-bottom: 0.15rem;
    }
    .modal-original {
      font-size: 0.8rem;
      color: var(--muted);
      font-style: italic;
      margin-bottom: 0.22rem;
    }
    .modal-director { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.55rem; }

    .modal-imdb {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: #f5c518;
      color: #000;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.18rem 0.55rem;
      border-radius: 3px;
      margin-bottom: 0.7rem;
    }
    .modal-imdb-logo {
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .modal-details {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 0.18rem;
      margin-bottom: 0.75rem;
    }
    .modal-genres {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-bottom: 0.7rem;
    }
    .genre-tag {
      font-size: 0.7rem;
      padding: 0.15rem 0.55rem;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
    }
    .modal-link {
      display: inline-block;
      font-size: 0.82rem;
      color: var(--accent);
      text-decoration: underline;
    }
    .modal-link:hover { color: var(--text); }

    .no-results {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .site-title { font-size: 1.7rem; }
      .movies-grid { grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 1rem 0.8rem; }
      .modal-inner { flex-direction: column; }
      .modal-poster-wrap { width: 90px; }
      .stats-bar { gap: 1.2rem; }
    }
  </style>
  <link rel="preconnect" href="https://images.metahub.space">
  <link rel="dns-prefetch" href="//images.metahub.space">
</head>
<body>
  <main>
    <header class="site-header">
      <h1 class="site-title">Traigan pororó</h1>
      <p class="site-tagline">
        No pago suscripciones, pero tengo los subtítulos.
        
      </p>
    </header>

    <a href="/blog/" class="back-link">← Volver al inicio</a>

    <div class="stats-bar" id="statsBar"></div>

    <div class="search-wrap">
      <input type="search" class="search-input" id="searchInput" placeholder="Buscar película o director…">
    </div>

    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">Año visto:</span>
        <div id="yearFilterBtns" style="display:flex;gap:0.5rem;flex-wrap:wrap;"></div>
      </div>
    </div>

    <div id="moviesContainer"></div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-label="Detalle de la película">
    <div class="modal">
      <button class="modal-close" id="modalClose" aria-label="Cerrar">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="peliculas.js"></script>
  <script>
  // Los pósteres se cargan directamente desde el proveedor actual.

  // ── Render ──
  let activeYear = 'all';
  let searchQuery = '';

  function getYearWatched(m) {
    return m.created ? m.created.slice(0, 4) : '?';
  }

  function getYears() {
    const s = new Set(MOVIES.map(m => getYearWatched(m)).filter(y => y !== '?'));
    return [...s].sort();
  }

  function filteredMovies() {
    return MOVIES
      .slice()
      .sort((a, b) => (b.created || '').localeCompare(a.created || ''))
      .filter(m => {
      const yearMatch = activeYear === 'all' || getYearWatched(m) === activeYear;
      const q = searchQuery.toLowerCase();
      const searchMatch = !q ||
        m.title.toLowerCase().includes(q) ||
        m.original_title.toLowerCase().includes(q) ||
        m.directors.toLowerCase().includes(q) ||
        m.genres.toLowerCase().includes(q);
      return yearMatch && searchMatch;
    });
  }

  function renderStats(movies) {
    const total = movies.length;
    const totalMins = movies.reduce((s, m) => s + (parseInt(m.runtime) || 0), 0);
    const totalHrs = Math.round(totalMins / 60);
    const ratings = movies.map(m => parseFloat(m.imdb_rating)).filter(r => !isNaN(r));
    const avgRating = ratings.length ? (ratings.reduce((a, b) => a + b, 0) / ratings.length).toFixed(1) : '–';

    document.getElementById('statsBar').innerHTML = `
      <div class="stat">
        <span class="stat-value">${total}</span>
        <span class="stat-label">Películas</span>
      </div>
      <div class="stat">
        <span class="stat-value">${totalHrs}</span>
        <span class="stat-label">Horas vistas</span>
      </div>
      <div class="stat">
        <span class="stat-value">${avgRating}</span>
        <span class="stat-label">Puntaje IMDb prom.</span>
      </div>
    `;
  }

  function renderYearFilters() {
    const years = getYears();
    const container = document.getElementById('yearFilterBtns');
    const btns = [{ label: 'Todas', value: 'all' }, ...years.map(y => ({ label: y, value: y }))];
    container.innerHTML = btns.map(b => `
      <button class="filter-btn ${b.value === activeYear ? 'active' : ''}"
              data-year="${b.value}">${b.label}</button>
    `).join('');
    container.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeYear = btn.dataset.year;
        renderAll();
      });
    });
  }

  function renderGrid(movies) {
    const container = document.getElementById('moviesContainer');
    if (movies.length === 0) {
      container.innerHTML = '<div class="no-results">No se encontraron películas.</div>';
      return;
    }

    container.innerHTML = `<div class="movies-grid">${
      movies.map((m, i) => `
        <div class="movie-card" tabindex="0" role="button" data-idx="${MOVIES.indexOf(m)}"
             aria-label="${m.title}">
          <div class="movie-poster-wrap">
            <img class="movie-poster"
                 loading="${i < 12 ? 'eager' : 'lazy'}"
                 fetchpriority="${i < 4 ? 'high' : 'auto'}"
                 decoding="async"
                 src="https://images.metahub.space/poster/medium/${m.imdb_id}/img"
                 alt="${m.title}"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="movie-poster-placeholder" style="display:none">
              <span>${m.title}</span>
            </div>
            ${m.imdb_rating ? `<span class="imdb-badge">★ ${m.imdb_rating}</span>` : ''}
          </div>
          <div class="movie-title">${m.title}</div>
          <div class="movie-director">${m.directors}</div>
          <div class="movie-meta">${m.year}</div>
        </div>
      `).join('')
    }</div>`;

    container.querySelectorAll('.movie-card').forEach(card => {
      card.addEventListener('click', () => openModal(parseInt(card.dataset.idx)));
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') openModal(parseInt(card.dataset.idx));
      });
    });
  }

  function renderAll() {
    const movies = filteredMovies();
    renderStats(movies);
    renderYearFilters();
    renderGrid(movies);
  }

  // ── Modal ──
  function openModal(idx) {
    const m = MOVIES[idx];
    if (!m) return;

    const genreTags = m.genres
      ? m.genres.split(',').map(g => `<span class="genre-tag">${g.trim()}</span>`).join('')
      : '';

    const runtimeStr = m.runtime ? `${m.runtime} min` : '';
    const watchedStr = m.created ? m.created.slice(0, 10) : '';

    document.getElementById('modalContent').innerHTML = `
      <div class="modal-inner">
        <div class="modal-poster-wrap">
          <img loading="eager" decoding="async" src="https://images.metahub.space/poster/medium/${m.imdb_id}/img"
               alt="${m.title}"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
          <div class="modal-poster-placeholder" style="display:none">
            <span>${m.title}</span>
          </div>
        </div>
        <div class="modal-info">
          <div class="modal-title">${m.title}</div>
          ${m.original_title && m.original_title !== m.title
            ? `<div class="modal-original">${m.original_title}</div>` : ''}
          <div class="modal-director">${m.directors}</div>
          ${m.imdb_rating ? `
            <div class="modal-imdb">
              <span class="modal-imdb-logo">IMDb</span>
              ★ ${m.imdb_rating}
            </div>` : ''}
          <div class="modal-details">
            ${m.year ? `<span>Año: ${m.year}</span>` : ''}
            ${runtimeStr ? `<span>Duración: ${runtimeStr}</span>` : ''}
            ${m.title_type && m.title_type !== 'Película' ? `<span>Tipo: ${m.title_type}</span>` : ''}
            ${watchedStr ? `<span>Vista: ${watchedStr}</span>` : ''}
          </div>
          ${genreTags ? `<div class="modal-genres">${genreTags}</div>` : ''}
          <a class="modal-link" href="${m.url}" target="_blank" rel="noopener">Ver en IMDb ↗</a>
        </div>
      </div>
    `;

    const overlay = document.getElementById('modalOverlay');
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  // ── Search ──
  document.getElementById('searchInput').addEventListener('input', e => {
    searchQuery = e.target.value.trim();
    renderAll();
  });

  // ── Init ──
  renderAll();
  </script>
<script data-pplx-inline-edit>
(function(){
  if(window===window.top)return;
  function inlineAll(orig,clone){
    if(orig.nodeType!==1)return;
    try{
      var cs=getComputedStyle(orig);
      var t='';
      for(var i=0;i<cs.length;i++){t+=cs[i]+':'+cs.getPropertyValue(cs[i])+';';}
      clone.style.cssText=t;
    }catch(e){}
    var oc=orig.children,cc=clone.children;
    for(var j=0;j<oc.length&&j<cc.length;j++){inlineAll(oc[j],cc[j]);}
  }
  function stripExternal(clone){
    var imgs=clone.querySelectorAll('img');
    for(var i=0;i<imgs.length;i++){
      var s=imgs[i].getAttribute('src');
      if(s&&!s.startsWith('data:'))imgs[i].removeAttribute('src');
    }
    var all=clone.querySelectorAll('*');
    for(var i=0;i<all.length;i++){
      var st=all[i].style.cssText;
      if(st&&st.indexOf('url(')>=0){
        all[i].style.cssText=st.replace(/url\(["']?(?!data:)[^)"']*["']?\)/gi,'none');
      }
    }
  }
  window.addEventListener('message',function(e){
    if(!e.data||e.data.type!=='INLINE_EDIT_CAPTURE_REQUEST')return;
    var scrollX=window.scrollX||window.pageXOffset||0;
    var scrollY=window.scrollY||window.pageYOffset||0;
    var w=window.innerWidth,h=window.innerHeight;
    try{
      var clone=document.documentElement.cloneNode(true);
      var rm=clone.querySelectorAll('script,link[rel="stylesheet"],style');
      for(var i=0;i<rm.length;i++){rm[i].remove();}
      inlineAll(document.documentElement,clone);
      stripExternal(clone);
      var html=new XMLSerializer().serializeToString(clone);
      var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'
        +'<foreignObject width="100%" height="100%">'
        +'<div xmlns="http://www.w3.org/1999/xhtml" style="width:'+w+'px;height:'+h+'px;overflow:hidden">'
        +'<div style="transform:translate(-'+scrollX+'px,-'+scrollY+'px);transform-origin:top left">'
        +html+'</div></div></foreignObject></svg>';
      var svgUrl='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
      var img=new Image();
      img.onload=function(){
        var c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0);
        window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:c.toDataURL('image/png'),scrollX:scrollX,scrollY:scrollY},'*');
      };
      img.onerror=function(){
        window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:null,scrollX:scrollX,scrollY:scrollY},'*');
      };
      img.src=svgUrl;
    }catch(err){
      window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:null,scrollX:scrollX,scrollY:scrollY},'*');
    }
  });
})();
</script></body>
</html>
